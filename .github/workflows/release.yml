name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Must match ci.yml — see the note there about Swift 5.10.
  XCODE_VERSION: "26.2"

jobs:
  build-app:
    name: Build & package EnvMatrix.app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$APP" ]; then
            sudo xcode-select -s "$APP"
          else
            echo "Xcode ${XCODE_VERSION} not on this image; available:"
            ls -d /Applications/Xcode*.app || true
            sudo xcode-select -s /Applications/Xcode.app
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-release-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # strip leading v
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (release, universal)
        run: |
          set -euxo pipefail
          swift build -c release --arch arm64 --arch x86_64

      - name: Assemble EnvMatrix.app bundle
        id: assemble
        run: |
          set -euxo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BIN_PATH=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          chmod +x scripts/assemble_app.sh
          scripts/assemble_app.sh \
            --bin "$BIN_PATH/EnvMatrix" \
            --out . \
            --version "$VERSION" \
            --icon Sources/EnvMatrix/Resources/AppIcon.icns \
            --sign adhoc

      - name: Verify universal architectures
        id: verify
        run: |
          set -euxo pipefail
          ARCHS=$(lipo -archs EnvMatrix.app/Contents/MacOS/EnvMatrix)
          echo "$ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          echo "archs=$ARCHS" >> "$GITHUB_OUTPUT"

      - name: Package zip and compute SHA-256
        id: bundle
        run: |
          set -euxo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="EnvMatrix-${VERSION}-macOS-universal.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent EnvMatrix.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          SHA256=$(awk '{print $1}' "$ZIP.sha256")
          echo "zip=$ZIP"          >> "$GITHUB_OUTPUT"
          echo "sha=$ZIP.sha256"   >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"    >> "$GITHUB_OUTPUT"

      - name: Package dmg and compute SHA-256
        id: dmg
        run: |
          set -euxo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          chmod +x scripts/make_dmg.sh
          scripts/make_dmg.sh --app EnvMatrix.app --out . --version "$VERSION"
          DMG="EnvMatrix-${VERSION}-macOS-universal.dmg"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          echo "dmg=$DMG"        >> "$GITHUB_OUTPUT"
          echo "sha=$DMG.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$(awk '{print $1}' "$DMG.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnvMatrix-macOS
          path: |
            ${{ steps.bundle.outputs.zip }}
            ${{ steps.bundle.outputs.sha }}
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.sha }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EnvMatrix ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Build info

            - Architectures: ${{ steps.verify.outputs.archs }}
            - SHA-256: `${{ steps.dmg.outputs.sha256 }}`  (${{ steps.dmg.outputs.dmg }})
            - SHA-256: `${{ steps.bundle.outputs.sha256 }}`  (${{ steps.bundle.outputs.zip }})
          files: |
            ${{ steps.dmg.outputs.dmg }}
            ${{ steps.dmg.outputs.sha }}
            ${{ steps.bundle.outputs.zip }}
            ${{ steps.bundle.outputs.sha }}
