name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the toolchain the project is actually developed on.
  # The sources use concurrency patterns that Swift 5.10 rejects (and that
  # crash its frontend), so pinning an old Xcode only produces red builds.
  XCODE_VERSION: "26.2"

jobs:
  build-and-test:
    name: Build & Test (macOS 26, Xcode 26.2)
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$APP" ]; then
            sudo xcode-select -s "$APP"
          else
            echo "Xcode ${XCODE_VERSION} not on this image; available:"
            ls -d /Applications/Xcode*.app || true
            sudo xcode-select -s /Applications/Xcode.app
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build -v

      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Export coverage summary
        if: always()
        run: |
          set -euo pipefail
          BIN=$(swift build --show-bin-path)
          PROF="$BIN/codecov/default.profdata"
          if [ -f "$PROF" ]; then
            XCTEST=$(ls "$BIN"/*.xctest/Contents/MacOS/* 2>/dev/null | head -n1 || true)
            if [ -n "$XCTEST" ] && [ -f "$XCTEST" ]; then
              xcrun llvm-cov report \
                -instr-profile="$PROF" \
                "$XCTEST" \
                -ignore-filename-regex='.build|Tests' \
                | tee coverage-summary.txt
            else
              echo "xctest binary not found; skipping coverage report" | tee coverage-summary.txt
            fi
          else
            echo "profdata not found at $PROF" | tee coverage-summary.txt
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: ignore
